name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build installable apps'
        type: choice
        options: [none, android, ios, both]
        default: both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx expo lint
      - run: npm run typecheck
      - run: npm test -- --ci

  # Builds only on a tag or a manual run: macOS minutes are the scarce ones.
  android:
    name: Android APK
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.build == 'android' || inputs.build == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Release build signed with the debug key: installable by side-loading, not for a store.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: wroclaw-transit-android
          path: android/app/build/outputs/apk/release/app-release.apk

  ios:
    name: iOS unsigned IPA
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.build == 'ios' || inputs.build == 'both'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Also runs `pod install`.
      - run: npx expo prebuild --platform ios
      - name: Archive without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace WroclawTransit.xcworkspace \
            -scheme WroclawTransit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WroclawTransit.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/WroclawTransit.xcarchive/Products/Applications/WroclawTransit.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry WroclawTransit-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: wroclaw-transit-ios-unsigned
          path: ${{ runner.temp }}/ipa/WroclawTransit-unsigned.ipa
